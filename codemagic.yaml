workflows:

  # ══════════════════════════════════════════════════════
  #  ANDROID — Debug APK + Release AAB
  # ══════════════════════════════════════════════════════
  android-build:
    name: Android Build
    max_build_duration: 60
    environment:
      node: 22.0.0
      java: 21
      groups:
        - supabase_credentials
      vars:
        PACKAGE_NAME: "uz.drivepass.app"

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web app
        script: npm run build

      - name: Sync Capacitor → Android
        script: npx cap sync android

      - name: Build Android Debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - e5270816@gmail.com
        notify:
          success: true
          failure: true

  # ══════════════════════════════════════════════════════
  #  iOS — IPA (Mac-сервер в облаке, без твоего Mac!)
  # ══════════════════════════════════════════════════════
  ios-build:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2   # Mac M2 в облаке Codemagic
    environment:
      node: 22.0.0
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: ad_hoc   # для тестирования
        bundle_identifier: uz.drivepass.app
      groups:
        - supabase_credentials
      vars:
        BUNDLE_ID: "uz.drivepass.app"
        APP_STORE_APP_ID: "uz.drivepass.app"

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web app
        script: npm run build

      - name: Add iOS platform (если ещё нет)
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor → iOS
        script: npx cap sync ios

      - name: Set Info.plist permissions
        script: |
          INFO_PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'DrivePass+ использует камеру для сканирования QR-кодов клиентов'" "$INFO_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'DrivePass+ использует камеру для сканирования QR-кодов клиентов'" "$INFO_PLIST"

          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'DrivePass+ определяет местоположение для показа ближайших автомоек'" "$INFO_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription 'DrivePass+ определяет местоположение для показа ближайших автомоек'" "$INFO_PLIST"

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - e5270816@gmail.com
        notify:
          success: true
          failure: true
      # Раскомментируй когда будет аккаунт App Store:
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true

  # ══════════════════════════════════════════════════════
  #  ОБА СРАЗУ — Android + iOS одновременно
  # ══════════════════════════════════════════════════════
  both-platforms:
    name: Build Both (Android + iOS)
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Trigger both workflows
        script: echo "Используй отдельные workflows android-build и ios-build"
