<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#2563EB" />

    <!-- iOS PWA / Capacitor -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DrivePass+" />

    <!-- Запрет выделения и контекстного меню как в нативном приложении -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Telegram Mini App SDK — no-op outside Telegram, so this is safe to always load -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <title>DrivePass+</title>

    <style>
      /* Нативный reset — без мигания, со скроллом */
      * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; box-sizing: border-box; }

      html {
        height: 100%;
        height: -webkit-fill-available;
        overscroll-behavior: none;
        overflow-x: hidden;
        scrollbar-width: none; /* Firefox */
        -ms-overflow-style: none; /* legacy Edge */
      }

      body {
        height: 100%;
        min-height: 100vh;
        min-height: -webkit-fill-available;
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        overscroll-behavior-y: none;
        -webkit-overflow-scrolling: touch;
        overflow-x: hidden;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      /* Telegram Desktop's Mini App WebView (Chromium-based) draws a native scrollbar
         track that stays a constant white strip regardless of the page's own background
         color -- hide it everywhere via the WebKit/Blink-specific selector while keeping
         scrolling itself fully working. */
      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      #root {
        height: 100%;
        min-height: 100vh;
        min-height: -webkit-fill-available;
        overflow: visible;
      }

      /* iOS Safe Area переменные для Capacitor */
      :root {
        --sat: env(safe-area-inset-top);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
        --sar: env(safe-area-inset-right);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
