<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#2563EB" />

    <!-- iOS PWA / Capacitor -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DrivePass+" />

    <!-- Запрет выделения и контекстного меню как в нативном приложении -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <title>DrivePass+</title>

    <style>
      /* Нативный reset — без мигания, со скроллом */
      * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; box-sizing: border-box; }

      html {
        height: 100%;
        /* НЕ overflow:hidden — иначе скролл заблокирован везде */
        overscroll-behavior: none;
      }

      body {
        height: 100%;
        margin: 0;
        padding: 0;
        /* Белый фон — без синего флеша при загрузке */
        background-color: #ffffff;
        /* Запрет "резинки" на iOS */
        overscroll-behavior-y: none;
        /* Плавный скролл как в нативном приложении */
        -webkit-overflow-scrolling: touch;
      }

      #root {
        height: 100%;
        /* Позволяем дочерним контейнерам скроллиться */
        overflow: visible;
      }

      /* iOS Safe Area переменные для Capacitor */
      :root {
        --sat: env(safe-area-inset-top);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
        --sar: env(safe-area-inset-right);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
