name: Deploy PWA

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build
        env:
          VITE_API_BASE_URL: https://api.drivepassplus.app/api/v1
          VITE_TELEGRAM_BOT_USERNAME: DrivePass_bot
        run: npm run build

      - name: Load deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy over rsync
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 62.238.98.200 >> ~/.ssh/known_hosts
          rsync -avzr --delete dist/ root@62.238.98.200:/opt/drivepass-pwa/
