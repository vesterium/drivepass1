name: Deploy PWA

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build
        env:
          VITE_API_BASE_URL: https://api.drivepassplus.app/api/v1
          VITE_TELEGRAM_BOT_USERNAME: DrivePass_bot
        run: npm run build

      - name: Deploy over rsync
        env:
          DEPLOY_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 62.238.98.200 >> ~/.ssh/known_hosts
          rsync -avzr --delete -e "ssh -i ~/.ssh/deploy_key" dist/ root@62.238.98.200:/opt/drivepass-pwa/
